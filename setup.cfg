[metadata]
name = sampire
version = attr: sampire.__version__
description = A btop-style terminal sampler, chopper and drum machine with an autonomous creative engine
long_description = file: README.md
long_description_content_type = text/markdown
author = Jeremy Bell
license = GPL-3.0-only
license_files = LICENSE
url = https://github.com/fourzerosix/SAMPire
project_urls =
    Issues = https://github.com/fourzerosix/SAMPire/issues
keywords = sampler, drum machine, sp-404, mpc, chopping, sequencer, audio, terminal, tui, numpy
classifiers =
    Environment :: Console :: Curses
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: POSIX :: Linux
    Operating System :: MacOS :: MacOS X
    Programming Language :: Python :: 3
    Topic :: Multimedia :: Sound/Audio :: Sound Synthesis

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.21
    scipy>=1.7
    soundfile>=0.12

[options.packages.find]
include = sampire*

[options.extras_require]
audio =
    sounddevice>=0.4.4
midi =
    mido>=1.3
    python-rtmidi>=1.5
hq =
    soxr
fx =
    pedalboard
analysis =
    aubio-ledfx
stems =
    demucs
dev =
    pytest
    pyte
    build
    twine
all =
    sounddevice>=0.4.4
    mido>=1.3
    python-rtmidi>=1.5
    soxr
    pedalboard
    aubio-ledfx

[options.entry_points]
console_scripts =
    sampire = sampire.cli:main
